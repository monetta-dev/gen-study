<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gen Study</title>
    <link rel="stylesheet" href="./styles.css">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]]
        },
        svg: { fontCache: "global" }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script defer src="./config.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="request-panel" aria-label="Generation request">
        <div class="panel-header">
          <div>
            <h1>Gen Study</h1>
            <p>Generate Japanese entrance exam questions with verified answers.</p>
          </div>
        </div>

        <form id="generateForm" class="generation-form" autocomplete="off">
          <div class="field-grid">
            <label>
              <span>Subject</span>
              <select id="subjectInput" name="subject">
                <option value="mathematics">Mathematics</option>
                <option value="physics">Physics</option>
                <option value="chemistry">Chemistry</option>
              </select>
            </label>

            <label>
              <span>Difficulty Level</span>
              <input id="levelInput" name="level" type="text" list="levelOptions" value="University of Tokyo" autocomplete="off" required>
            </label>

            <label class="wide-field">
              <span>Topic</span>
              <input id="topicInput" name="topic" type="text" list="topicOptions" value="Probability Recurrence Relations" autocomplete="off" required>
            </label>
          </div>

          <datalist id="levelOptions">
            <option value="Standard"></option>
            <option value="MARCH"></option>
            <option value="Waseda"></option>
            <option value="Keio"></option>
            <option value="Kyoto University"></option>
            <option value="University of Tokyo"></option>
          </datalist>

          <datalist id="topicOptions">
            <option value="Probability Recurrence Relations"></option>
            <option value="Integer Problems"></option>
            <option value="Mechanics"></option>
            <option value="Electromagnetism"></option>
            <option value="Acid-Base Titration"></option>
            <option value="Chemical Equilibrium"></option>
          </datalist>

          <details class="connection-settings">
            <summary>Connection</summary>
            <div class="field-grid connection-grid">
              <label class="wide-field">
                <span>API URL</span>
                <input id="apiUrlInput" name="apiUrl" type="url">
              </label>
              <label class="wide-field">
                <span>Visual API URL</span>
                <input id="visualApiUrlInput" name="visualApiUrl" type="url">
              </label>
              <label class="wide-field">
                <span>API Key</span>
                <input id="apiKeyInput" name="apiKey" type="password" autocomplete="off">
              </label>
            </div>
          </details>

          <div class="actions">
            <label class="visual-toggle">
              <input id="autoVisualInput" name="autoVisual" type="checkbox">
              <span>Generate visuals</span>
            </label>
            <button id="sampleButton" type="button">Load Sample</button>
            <button id="visualButton" type="button" disabled>Generate Visuals</button>
            <button id="generateButton" type="submit">Generate</button>
          </div>
        </form>

        <p id="statusMessage" class="status" role="status"></p>
      </section>

      <section class="output-grid" aria-label="Rendered output">
        <article class="output-section problem-section">
          <div class="section-label">Problem</div>
          <div id="problemOutput" class="rendered-text empty">No problem loaded.</div>
        </article>

        <article class="output-section solution-section">
          <div class="section-label">Solution</div>
          <div id="solutionOutput" class="rendered-text empty">No solution loaded.</div>
        </article>
      </section>

      <section class="visual-section" aria-label="Generated visuals">
        <div class="section-label">Visuals</div>
        <div id="visualOutput" class="visual-output empty">No visuals loaded.</div>
      </section>

      <section class="process-section" aria-label="Generation process">
        <div class="section-label">Process</div>
        <div id="processOutput" class="process-output empty">No process loaded.</div>
      </section>

      <details class="raw-panel">
        <summary>Plain Text</summary>
        <pre id="rawOutput">{}</pre>
      </details>
    </main>
  </body>
</html>
